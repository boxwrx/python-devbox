[project]
name = "helloworld"
version = "1.0.0"
description = "A simple helloworld Python package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0"
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
